<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Погодний дашборд</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="js/script.js" defer></script>
</head>

<body>
  <header class="site-header">
    <h1>Погодний дашборд</h1>

    <nav class="main-nav">
      <ul>
        <li><a href="#current">Поточна погода</a></li>
        <li><a href="#forecast">Прогноз</a></li>
      </ul>
    </nav>

    <form class="search-form" role="search">
      <label for="city-search">Пошук міста:</label>
      <input type="text" id="city-search" name="city" placeholder="Введіть місто...">
      <button type="submit">Шукати</button>
    </form>
  </header>

  <main class="main-content">
    <form id="add-weather-form" class="add-weather-form" onsubmit="event.preventDefault();"></form>

    <div class="warmest-action"></div>

    <div class="top-wrapper">
      <section id="current" class="content-section current-weather">
        <h2>Поточна погода</h2>
        <button id="update-btn" class="add-weather-submit" style="margin-bottom: 10px;">Оновити погоду</button>
        <p id="api-status" style="font-weight: 600; color: #fbbf24; margin: 0 0 15px 0;"></p>
        <div class="current-weather-info">
          <img src="assets/img/sunny.svg" alt="Сонячно, без опадів">
          <div class="current-details">
            <p class="city-name">Київ</p>
            <p class="temp-display"><span class="temp-value temp-warm">+21&deg;C</span>, <span
                class="weather-cond">ясно</span></p>
          </div>
        </div>
      </section>

      <aside class="daily-tip">
        <h2>Порада дня</h2>
        <p>Що вдягнути: сьогодні очікується сонячна погода, але ввечері можливе похолодання. Візьміть із собою легку
          куртку!</p>
      </aside>
    </div>

    <section id="forecast" class="content-section forecast-section">
      <h2>Прогноз на тиждень</h2>
      <p id="avg-temp" class="avg-temp-info"></p>
      <div class="forecast-grid">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Навчальний проєкт "Погодний дашборд" &copy; 2026</p>
  </footer>
</body>

</html>
